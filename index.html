<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>E-LegalBoom — Document Intake</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fb;
    }

    .page {
      max-width: 860px;
      margin: 40px auto;
      background: #ffffff;
      padding: 36px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 26px;
    }

    .doc-header {
      border: 1px solid #e2e6f0;
      background: #f9fbff;
      padding: 16px;
      border-radius: 6px;
      margin-bottom: 28px;
    }

    .doc-header p {
      margin: 4px 0;
      font-size: 14px;
    }

    .section {
      margin-bottom: 26px;
    }

    .section h3 {
      margin-bottom: 10px;
      font-size: 16px;
      border-bottom: 1px solid #eee;
      padding-bottom: 4px;
    }

    label {
      display: block;
      margin-top: 14px;
      font-size: 14px;
    }

    input, select, textarea {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      font-size: 14px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    textarea {
      min-height: 90px;
    }

    .row {
      display: flex;
      gap: 20px;
    }

    .row > div {
      flex: 1;
    }

    button {
      margin-top: 30px;
      padding: 14px 22px;
      background: #2b6cff;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1f57d6;
    }
  </style>
</head>

<body>
  <div class="page">
    <h1>Document Information</h1>

    <!-- DOCUMENT CONTEXT (READ-ONLY) -->
    <div class="doc-header">
      <p><strong>Document Requested:</strong> <span id="docLabel"></span></p>
      <p><strong>Service Tier:</strong> <span id="tierLabel"></span></p>
    </div>

    <form id="intakeForm">

      <!-- REQUESTOR -->
      <div class="section">
        <h3>Requestor Information</h3>

        <div class="row">
          <div>
            <label>First Name</label>
            <input id="first_name" required />
          </div>
          <div>
            <label>Last Name</label>
            <input id="last_name" required />
          </div>
        </div>

        <label>Email Address</label>
        <input id="email" type="email" required />
      </div>

      <!-- ENTITY -->
      <div class="section">
        <h3>Entity Information</h3>

        <label>Entity Type</label>
        <select id="entity_type">
          <option value="">Select</option>
          <option>Individual</option>
          <option>LLC</option>
          <option>Corporation</option>
          <option>Partnership</option>
          <option>Trust</option>
        </select>

        <label>Entity Name (if applicable)</label>
        <input id="entity_name" />
      </div>

      <!-- GOVERNING -->
      <div class="section">
        <h3>Governing Authority</h3>

        <label>Governing State</label>
        <select id="governing_state" required>
          <option value="">Select state</option>
          <option>AL</option><option>CA</option><option>DE</option>
          <option>FL</option><option>NY</option><option>TX</option>
        </select>
      </div>

      <!-- PARTIES -->
      <div class="section">
        <h3>Parties</h3>

        <label>Party A Name</label>
        <input id="party_a_name" />

        <label>Party A Role</label>
        <input id="party_a_role" />

        <label>Party B Name</label>
        <input id="party_b_name" />

        <label>Party B Role</label>
        <input id="party_b_role" />
      </div>

      <!-- NOTES -->
      <div class="section">
        <h3>Additional Instructions</h3>
        <textarea id="notes" placeholder="Any special terms, conditions, or notes…"></textarea>
      </div>

      <button type="submit">Continue to Payment</button>
    </form>
  </div>

  <script src="intake.js"></script>
</body>
</html>
