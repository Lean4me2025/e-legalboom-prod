<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>E-LegalBoom – Intake</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f6f8fc;
      margin: 0;
    }

    .container {
      max-width: 760px;
      margin: 60px auto;
      background: #fff;
      padding: 32px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,.06);
    }

    label {
      display: block;
      margin-top: 16px;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      font-size: 15px;
    }

    button {
      margin-top: 28px;
      padding: 14px 22px;
      background: #2b6cff;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    .error {
      margin-top: 16px;
      color: #b00020;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Tell us a bit more</h1>

    <!-- =====================================================
         🔒 CANONICAL VALUES (SYNCED FROM UI)
         ===================================================== -->
    <input type="hidden" id="tier" />
    <input type="hidden" id="doc_type" />
    <input type="hidden" id="management" />
    <input type="hidden" id="state" />

    <label>Full Legal Name</label>
    <input type="text" id="full_name" required />

    <label>Email Address</label>
    <input type="email" id="email" required />

    <label>Business Name (if applicable)</label>
    <input type="text" id="business_name" />

    <!-- ✅ VISIBLE STATE SELECTOR -->
    <label>State of Formation</label>
    <select id="stateSelect" required>
      <option value="">— Select a state —</option>
      <option value="AL">Alabama</option>
      <option value="AK">Alaska</option>
      <option value="AZ">Arizona</option>
      <option value="AR">Arkansas</option>
      <option value="CA">California</option>
      <option value="CO">Colorado</option>
      <option value="CT">Connecticut</option>
      <option value="DE">Delaware</option>
      <option value="FL">Florida</option>
      <option value="GA">Georgia</option>
      <option value="IL">Illinois</option>
      <option value="NY">New York</option>
      <option value="TX">Texas</option>
      <!-- add remaining states as desired -->
    </select>

    <button id="submitBtn">Continue to Payment</button>
    <div id="errorBox" class="error"></div>
  </div>

  <script>
    /**********************************************************
     * STEP 1: READ SUMMARY PARAMS
     **********************************************************/
    const params = new URLSearchParams(window.location.search);

    const tier = params.get("tier");
    const docType = params.get("doc_type");
    const management = params.get("management");
    const incomingState = params.get("state");

    if (!tier || !docType || !management) {
      alert("Missing required data. Please restart.");
      throw new Error("Missing summary parameters");
    }

    document.getElementById("tier").value = tier;
    document.getElementById("doc_type").value = docType;
    document.getElementById("management").value = management;

    /**********************************************************
     * STEP 2: SYNC STATE PARAM → DROPDOWN → HIDDEN FIELD
     **********************************************************/
    const stateSelect = document.getElementById("stateSelect");
    const stateHidden = document.getElementById("state");

    if (incomingState) {
      stateSelect.value = incomingState;
      stateHidden.value = incomingState;
    }

    stateSelect.addEventListener("change", () => {
      stateHidden.value = stateSelect.value;
    });

    /**********************************************************
     * STEP 3: BUILD PAYLOAD
     **********************************************************/
    function buildPayload() {
      if (!stateHidden.value) {
        throw new Error("State not selected");
      }

      return {
        tier,
        doc_type: docType,
        management,
        state: stateHidden.value,

        full_name: full_name.value,
        email: email.value,
        business_name: business_name.value || null,

        status: "intake_completed",
        created_at: new Date().toISOString()
      };
    }

    /**********************************************************
     * 🔴 SUPABASE INSERT ZONE
     **********************************************************/

    );

    async function insertRequest(payload) {
      const { data, error } = await supabase
        .from("document_requests")
        .insert([payload])
        .select()
        .single();

      if (error) throw error;
      return data;
    }
    */

    /**********************************************************
     * STEP 4: SUBMIT + REDIRECT
     **********************************************************/
    document.getElementById("submitBtn").addEventListener("click", async () => {
      const errorBox = document.getElementById("errorBox");
      errorBox.textContent = "";

      try {
        const payload = buildPayload();

        // 🔴 Uncomment when Supabase is live
        // const record = await insertRequest(payload);
        // const requestId = record.id;

        // TEMP SAFE TEST REDIRECT
        window.location.href =
          `/payment.html?tier=${encodeURIComponent(payload.tier)}`;

      } catch (err) {
        errorBox.textContent = err.message || "Please complete all fields.";
      }
    });
  </script>
</body>
</html>
