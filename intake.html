<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>E-LegalBoom – Document Intake</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Supabase Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #f4f6f9;
      color: #222;
    }

    h1 {
      margin-bottom: 16px;
    }

    form {
      max-width: 640px;
      background: #fff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      margin-top: 14px;
      font-weight: 600;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    textarea {
      min-height: 80px;
    }

    button {
      margin-top: 24px;
      padding: 12px 18px;
      font-size: 15px;
      background: #2b6cff;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #1e54cc;
    }
  </style>
</head>

<body>

  <h1>Document Intake</h1>

  <form id="intakeForm">

    <!-- Context from URL -->
    <input type="hidden" name="doc_type" id="doc_type" />
    <input type="hidden" name="tier" id="tier" />

    <label>First Name</label>
    <input name="first_name" required />

    <label>Last Name</label>
    <input name="last_name" required />

    <label>Email</label>
    <input name="email" type="email" required />

    <label>Phone</label>
    <input name="phone" />

    <label>Street Address</label>
    <input name="street" />

    <label>City</label>
    <input name="city" />

    <label>State (Residence)</label>
    <input name="residence_state" />

    <label>ZIP</label>
    <input name="zip" />

    <label>Governing State</label>
    <input name="governing_state" />

    <label>Additional Details</label>
    <textarea name="details"></textarea>

    <button type="submit">Submit Intake</button>
  </form>

  <!-- 🚨 SINGLE, CLEAN SCRIPT BLOCK 🚨 -->
  <script>
    console.log("INTAKE SCRIPT LOADED");

    // ===============================
    // SUPABASE CONFIG
    // ===============================
    const SUPABASE_URL = "https://vvjbjfltqsivvxxifnvi.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2amJqZmx0cXNpdnZ4eGlmbnZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc5NzYzNTAsImV4cCI6MjA3MzU1MjM1MH0.F4zzcpCHl9v-Rnj0wgKJ5zBf1HteVyXelMLQDDEN28Q";

    const supabase = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    console.log("SUPABASE CLIENT INITIALIZED");

    // ===============================
    // CONTEXT FROM URL
    // ===============================
    const params = new URLSearchParams(window.location.search);

    document.getElementById("doc_type").value =
      params.get("doc_type") || "";

    document.getElementById("tier").value =
      params.get("tier") || "";

    // ===============================
    // SUBMIT HANDLER
    // ===============================
    document
      .getElementById("intakeForm")
      .addEventListener("submit", async (e) => {
        e.preventDefault();

        console.log("INTAKE SUBMIT HANDLER FIRED");

        const formData = Object.fromEntries(
          new FormData(e.target).entries()
        );

        const payload = {
          ...formData,
          created_at: new Date().toISOString()
        };

        console.log("PAYLOAD", payload);

        const result = await supabase
          .from("document_requests")
          .insert([payload]);

        console.log("INSERT RESULT", result);

        if (result.error) {
          alert("Submission failed — check console");
          console.error(result.error);
          return;
        }

        alert("Intake submitted successfully");
        e.target.reset();
      });
  </script>

</body>
</html>
