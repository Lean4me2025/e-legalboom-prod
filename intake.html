<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>E-LegalBoom | Document Intake</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Supabase JS (v2, global build) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --navy:#0a2540;
      --bg:#f6f8fb;
      --card:#ffffff;
      --border:#e5e7eb;
      --text:#0b1220;
      --muted:#6b7280;
      --danger:#b42318;
      --ok:#067647;
      --warn:#92400e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      background: var(--navy);
      color: #fff;
      padding: 18px 22px;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
    }

    header p {
      margin: 6px 0 0;
      font-size: 13px;
      opacity: 0.9;
    }

    main {
      max-width: 980px;
      margin: 22px auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px;
    }

    .status {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 12px;
      background: #eef2ff;
      border: 1px solid var(--border);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #9ca3af;
    }
    .dot.ok { background: #22c55e; }
    .dot.bad { background: #ef4444; }
    .dot.warn { background: #f59e0b; }

    .notice {
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      background: #fafafa;
      display: none;
    }
    .notice.show { display: block; }
    .notice.danger {
      border-color: #fca5a5;
      background: #fff5f5;
      color: var(--danger);
    }
    .notice.ok {
      border-color: #86efac;
      background: #f0fdf4;
      color: var(--ok);
    }

    h2 {
      margin: 16px 0 6px;
      font-size: 16px;
    }

    .hint {
      margin: 0 0 14px;
      font-size: 13px;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    @media (max-width: 820px) {
      .grid { grid-template-columns: 1fr; }
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-weight: 700;
      font-size: 13px;
    }

    input, textarea {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 14px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
    }

    button.primary {
      background: var(--navy);
      color: #fff;
    }
  </style>
</head>

<body>

<header>
  <h1>E-LegalBoom · Document Intake</h1>
  <p>Provide your information once. We handle the rest.</p>
</header>

<main>

  <!-- ================= STATUS ================= -->
  <div class="status">
    <div class="pill">
      <span class="dot" id="sbDot"></span>
      <span id="sbText">Supabase: pending</span>
    </div>
    <div class="pill">
      <span class="dot" id="docDot"></span>
      <span id="docText">Document: pending</span>
    </div>
    <div class="pill">
      <span class="dot" id="tierDot"></span>
      <span id="tierText">Tier: pending</span>
    </div>
  </div>

  <div class="notice danger" id="errorBox"></div>
  <div class="notice ok" id="okBox"></div>

  <!-- ================= FORM ================= -->
  <h2 id="formTitle">Intake</h2>
  <p class="hint" id="formHint"></p>

  <div class="grid" id="formFields">
    <!-- Fields will render here -->
  </div>

  <div class="actions">
    <button class="primary" id="continueBtn">Continue</button>
  </div>

</main>

<script>
/* ============================================================
   SUPABASE CONFIG — EDIT ONLY THE ANON KEY VALUE
   ============================================================ */

const SUPABASE_URL = "https://vwjbjfltqsivwxdifnvi.supabase.co";

/*
  👉 PASTE YOUR FULL ANON KEY BETWEEN THESE QUOTES
  👉 LEAVE THE QUOTES IN PLACE
*/
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2amJqZmx0cXNpdnZ4eGlmbnZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc5NzYzNTAsImV4cCI6MjA3MzU1MjM1MH0.F4zzcpCHl9v-Rnj0wgKJ5zBf1HteVyXelMLQDDEN28Q";

/* ============================================================ */

function qs(id){ return document.getElementById(id); }

function showError(msg){
  const box = qs("errorBox");
  box.textContent = msg;
  box.classList.add("show");
}

function showOk(msg){
  const box = qs("okBox");
  box.textContent = msg;
  box.classList.add("show");
}

document.addEventListener("DOMContentLoaded", () => {

  /* ---------- Validate config ---------- */
  if (!SUPABASE_URL || !SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.includes("PASTE_")) {
    qs("sbDot").classList.add("bad");
    qs("sbText").textContent = "Supabase: missing config";
    showError("Supabase URL or Anon key is missing or not filled in.");
    return;
  }

  if (!window.supabase) {
    qs("sbDot").classList.add("bad");
    qs("sbText").textContent = "Supabase: library not loaded";
    showError("Supabase JS library failed to load.");
    return;
  }

  const supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  qs("sbDot").classList.add("ok");
  qs("sbText").textContent = "Supabase: initialized";

  /* ---------- Read URL params ---------- */
  const params = new URLSearchParams(window.location.search);
  const tier = params.get("tier");
  const docType = params.get("doc_type");

  if (!docType) {
    qs("docDot").classList.add("bad");
    qs("docText").textContent = "Document: missing";
    showError("No document type was provided in the URL.");
    return;
  }

  qs("docDot").classList.add("ok");
  qs("docText").textContent = "Document: " + docType;

  if (tier) {
    qs("tierDot").classList.add("ok");
    qs("tierText").textContent = "Tier: " + tier;
  } else {
    qs("tierDot").classList.add("warn");
    qs("tierText").textContent = "Tier: not specified";
  }

  /* ---------- Render placeholder fields (next step: DB driven) ---------- */
  qs("formTitle").textContent = "Document Intake";
  qs("formHint").textContent =
    "This intake is loaded for document type: " + docType;

  const fields = qs("formFields");
  fields.innerHTML = `
    <div class="field">
      <label>Full Legal Name</label>
      <input type="text" />
    </div>
    <div class="field">
      <label>Email Address</label>
      <input type="email" />
    </div>
    <div class="field">
      <label>Additional Notes</label>
      <textarea></textarea>
    </div>
  `;

  showOk("Intake loaded successfully. Supabase connection is healthy.");

});
</script>

</body>
</html>
