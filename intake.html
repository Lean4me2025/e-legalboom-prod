<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>E-LegalBoom — Intake</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 24px;
      background: #f6f8fc;
      color: #1e1e2f;
    }
    h1, h2 {
      margin-top: 32px;
    }
    label {
      display: block;
      margin-top: 14px;
      font-weight: 600;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      font-size: 14px;
    }
    textarea {
      min-height: 90px;
    }
    button {
      margin-top: 36px;
      padding: 14px 22px;
      font-size: 16px;
      background: #2b6cff;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .section {
      border-top: 1px solid #ddd;
      padding-top: 24px;
      margin-top: 24px;
    }
  </style>
</head>

<body>

<h1>E-LegalBoom Intake</h1>
<p>Please complete the information below so we can prepare your document correctly.</p>

<form id="intakeForm">

  <!-- CUSTOMER -->
  <div class="section">
    <h2>Customer Information</h2>

    <label>Customer Name</label>
    <input id="customer_name" required />

    <label>Customer Email</label>
    <input id="customer_email" type="email" required />
  </div>

  <!-- ENTITY -->
  <div class="section">
    <h2>Entity Information</h2>

    <label>Entity Type</label>
    <select id="entity_type" required>
      <option value="">Select</option>
      <option value="LLC">LLC</option>
      <option value="Corporation">Corporation</option>
      <option value="Individual">Individual</option>
    </select>

    <label>Entity Name</label>
    <input id="entity_name" required />

    <label>Governing State</label>
    <input id="governing_state" required />

    <label>Management Model</label>
    <select id="management_model">
      <option value="">Select</option>
      <option value="Member-Managed">Member-Managed</option>
      <option value="Manager-Managed">Manager-Managed</option>
    </select>
  </div>

  <!-- DOCUMENT -->
  <div class="section">
    <h2>Document Details</h2>

    <label>Document Type</label>
    <select id="doc_type" required>
      <option value="">Select</option>
      <option value="llc_single_member">Single-Member LLC</option>
      <option value="llc_multi_member">Multi-Member LLC</option>
      <option value="operating_agreement">Operating Agreement</option>
      <option value="nda">NDA</option>
    </select>

    <label>Dispute Resolution Method</label>
    <select id="dispute_method">
      <option value="">Select</option>
      <option value="Arbitration">Arbitration</option>
      <option value="Mediation">Mediation</option>
      <option value="Court">Court</option>
    </select>

    <label>Non-Compete Option</label>
    <select id="non_compete_option">
      <option value="">Select</option>
      <option value="None">None</option>
      <option value="Limited">Limited</option>
      <option value="Standard">Standard</option>
    </select>
  </div>

  <!-- SPECIAL CLAUSES -->
  <div class="section">
    <h2>Special Clauses</h2>

    <label>Special Clauses / Notes</label>
    <textarea id="special_clauses"
      placeholder="Add any special clauses or notes you would like included."></textarea>
  </div>

  <button type="submit">Submit Intake</button>

</form>

<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

  const supabase = createClient(
    "https://vvjbjfltqsivvxxifnvi.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2amJqZmx0cXNpdnZ4eGlmbnZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc5NzYzNTAsImV4cCI6MjA3MzU1MjM1MH0.F4zzcpCHl9v-Rnj0wgKJ5zBf1HteVyXelMLQDDEN28Q
"
  );

  const form = document.getElementById("intakeForm");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const request_id = crypto.randomUUID();

    const payload = {
      request_id,

      doc_type: doc_type.value.trim(),
      entity_type: entity_type.value.trim(),
      entity_name: entity_name.value.trim(),
      governing_state: governing_state.value.trim().toUpperCase(),
      management_model: management_model.value || null,

      customer_name: customer_name.value.trim(),
      customer_email: customer_email.value.trim().toLowerCase(),

      dispute_method: dispute_method.value || null,
      non_compete_option: non_compete_option.value || null,

      special_clauses: special_clauses.value
        ? { text: special_clauses.value.trim() }
        : null,

      /* RELEASE + VERIFICATION PLACEHOLDERS */
      release_status: "PENDING",
      release_ready: false,
      verification_source: null,
      auto_release_enabled: false,

      payment_status: "PENDING",

      meta: {
        intake_version: "v1.0",
        intake_mode: "TEST",
        source: "intake",
        submitted_at: new Date().toISOString()
      }
    };

    const { error } = await supabase
      .from("document_requests")
      .insert([payload]);

    if (error) {
      alert("Submission failed: " + error.message);
      return;
    }

    alert("Intake submitted successfully (TEST MODE).");
    form.reset();
  });
</script>

</body>
</html>
