<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>E-LegalBoom Intake</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="intake.css" />
</head>

<body>
  <main class="doc-wrapper">
    <h1>Client Intake</h1>

    <form id="intakeForm">

      <label>First Name</label>
      <input name="first_name" required />

      <label>Last Name</label>
      <input name="last_name" required />

      <label>Email</label>
      <input name="email" type="email" required />

      <label>State</label>
      <select name="state" id="state" required>
        <option value="">Select state</option>
      </select>

      <label>Governing State</label>
      <select name="governing_state" id="governing_state" required>
        <option value="">Select governing state</option>
      </select>

      <!-- Hidden fields from summary -->
      <input type="hidden" name="tier" id="tier" />
      <input type="hidden" name="doc_type" id="doc_type" />

      <button type="submit">Continue to Payment</button>
    </form>
  </main>

  <!-- Supabase CDN (browser-safe) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="intake.js"></script>
</body>
</html>
