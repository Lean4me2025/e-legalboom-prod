<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>E-LegalBoom – Intake</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <h2>Document Intake</h2>

  <p id="lockedInfo"></p>

  <form id="intakeForm">

    <input id="last_name" placeholder="Last Name" required />

    <br /><br />

    <button type="submit">Submit & Pay</button>
  </form>

  <br />

  <!-- ABORT BUTTON -->
  <button onclick="abortOrder()">Cancel and Start Over</button>

  <script src="intake.js"></script>
</body>
</html>
