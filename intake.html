<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>E-LegalBoom – Document Intake</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="intake.css" />
</head>

<body>
  <main class="doc-wrapper">
    <header class="doc-header">
      <h1>Client Information Intake</h1>
      <p class="subtitle">
        Please complete the following information as it will appear in your legal document.
      </p>
    </header>

    <!-- CONTEXT (Hidden, fed from Summary/Tier) -->
    <input type="hidden" id="tier" name="tier" />
    <input type="hidden" id="doc_type" name="doc_type" />
    <input type="hidden" id="urgency" name="urgency" />

    <form id="intakeForm">

      <!-- SECTION: CLIENT -->
      <section class="doc-section">
        <h2>Client Information</h2>

        <div class="grid-2">
          <div>
            <label>First Name</label>
            <input name="first_name" required />
          </div>
          <div>
            <label>Last Name</label>
            <input name="last_name" required />
          </div>
        </div>

        <div class="grid-2">
          <div>
            <label>Email</label>
            <input name="email" type="email" required />
          </div>
          <div>
            <label>Phone</label>
            <input name="phone" />
          </div>
        </div>
      </section>

      <!-- SECTION: ADDRESS -->
      <section class="doc-section">
        <h2>Residence Address</h2>

        <label>Street Address</label>
        <input name="street" />

        <div class="grid-3">
          <input name="city" placeholder="City" />
          <select name="state">
            <option value="">State</option>
          </select>
          <input name="zip" placeholder="ZIP" />
        </div>
      </section>

      <!-- SECTION: GOVERNING STATE -->
      <section class="doc-section">
        <h2>Governing Jurisdiction</h2>
        <p class="hint">
          This is the state law that will govern your document.
        </p>
        <select name="governing_state">
          <option value="">Select Governing State</option>
        </select>
      </section>

      <!-- SECTION: PARTIES -->
      <section class="doc-section">
        <h2>Additional Parties (if applicable)</h2>

        <div class="grid-2">
          <input name="party1_name" placeholder="Party Name" />
          <input name="party1_role" placeholder="Role (Member, Manager, Trustee, etc.)" />
        </div>

        <div class="grid-2">
          <input name="party2_name" placeholder="Party Name" />
          <input name="party2_role" placeholder="Role" />
        </div>
      </section>

      <!-- SECTION: DETAILS -->
      <section class="doc-section">
        <h2>Additional Instructions</h2>
        <textarea name="details" rows="4"></textarea>
      </section>

      <footer class="doc-footer">
        <button type="submit">Continue</button>
      </footer>

    </form>
  </main>

  <script src="intake.js"></script>
</body>
</html>
