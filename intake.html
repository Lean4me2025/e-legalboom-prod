<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>E-LegalBoom | Document Intake</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f6f8fb;
      margin: 0;
      padding: 0;
    }
    header {
      background: #0a2540;
      color: white;
      padding: 20px;
    }
    h1 {
      margin: 0;
      font-size: 22px;
    }
    .meta {
      font-size: 14px;
      opacity: 0.9;
    }
    main {
      max-width: 900px;
      margin: 30px auto;
      background: white;
      padding: 30px;
      border-radius: 8px;
    }
    .field {
      margin-bottom: 18px;
    }
    .field label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .field input, .field textarea, .field select {
      width: 100%;
      padding: 10px;
      font-size: 15px;
    }
    button {
      background: #0a2540;
      color: white;
      border: none;
      padding: 14px 24px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 4px;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .error {
      color: red;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

<header>
  <h1 id="docTitle">Document Intake</h1>
  <div class="meta" id="docMeta"></div>
</header>

<main>
  <div id="error" class="error"></div>
  <form id="intakeForm"></form>
  <br />
  <button id="submitBtn">Continue</button>
</main>

<script>
/* =========================
   CONFIG
========================= */
const SUPABASE_URL = window.SUPABASE_URL || "https://vvjbjfltqsivvxxifnvi.supabase.co";
const SUPABASE_ANON_KEY = “eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2amJqZmx0cXNpdnZ4eGlmbnZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc5NzYzNTAsImV4cCI6MjA3MzU1MjM1MH0.F4zzcpCHl9v-Rnj0wgKJ5zBf1HteVyXelMLQDDEN28Q";
const supabase = supabaseJs.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* =========================
   PARAM PARSING
========================= */
const params = new URLSearchParams(window.location.search);
const tier = params.get("tier");
const docType = params.get("doc_type");
const bundle = params.get("bundle");
const docsParam = params.get("docs");

const selectedDocs = docsParam ? docsParam.split(",") : [];

/* =========================
   STATE
========================= */
let catalogDocs = {};
let fieldList = [];

/* =========================
   INIT
========================= */
init();

async function init() {
  try {
    await loadCatalog();
    resolveHeader();
    await loadFields();
    renderForm();
  } catch (err) {
    showError(err.message || "Failed to load intake.");
  }
}

/* =========================
   LOAD DOCUMENT CATALOG
========================= */
async function loadCatalog() {
  const { data, error } = await supabase
    .from("document_catalog")
    .select("doc_type, doc_name");

  if (error) throw error;

  data.forEach(d => {
    catalogDocs[d.doc_type] = d.doc_name;
  });
}

/* =========================
   HEADER RESOLUTION
========================= */
function resolveHeader() {
  let title = "";
  let meta = "";

  if (tier === "bundle") {
    title = catalogDocs[bundle] || "Document Bundle";
    meta = selectedDocs.map(d => catalogDocs[d] || d).join(" • ");
  } else {
    title = catalogDocs[docType] || "Document Intake";
    meta = "Tier " + tier;
  }

  document.getElementById("docTitle").innerText = title;
  document.getElementById("docMeta").innerText = meta;
}

/* =========================
   LOAD FIELDS (UNIVERSAL)
========================= */
async function loadFields() {
  const { data, error } = await supabase
    .from("document_field_map")
    .select("field_code, field_name, description")
    .eq("doc_type", "universal")
    .order("id");

  if (error) throw error;
  fieldList = data;
}

/* =========================
   RENDER FORM
========================= */
function renderForm() {
  const form = document.getElementById("intakeForm");
  form.innerHTML = "";

  fieldList.forEach(f => {
    const div = document.createElement("div");
    div.className = "field";

    const label = document.createElement("label");
    label.innerText = f.field_name;

    const input = document.createElement("input");
    input.name = f.field_code;
    input.placeholder = f.description || "";

    div.appendChild(label);
    div.appendChild(input);
    form.appendChild(div);
  });
}

/* =========================
   SUBMIT
========================= */
document.getElementById("submitBtn").addEventListener("click", async () => {
  try {
    const payload = {};
    fieldList.forEach(f => {
      payload[f.field_code] =
        document.querySelector(`[name="${f.field_code}"]`).value;
    });

    const request = {
      tier,
      doc_type: tier === "bundle" ? bundle : docType,
      selected_docs: tier === "bundle" ? selectedDocs : null,
      answers: payload,
      status: "intake_complete"
    };

    console.log("INTAKE PAYLOAD", request);

    // This is where it will later insert into document_requests
    // await supabase.from("document_requests").insert(request);

    alert("Intake captured successfully.");
  } catch (err) {
    showError(err.message || "Submission failed.");
  }
});

function showError(msg) {
  document.getElementById("error").innerText = msg;
}
</script>

</body>
</html>
