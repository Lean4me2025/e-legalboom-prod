<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>E-LegalBoom Intake</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fb;
      padding: 30px;
    }
    h1 { margin-bottom: 10px; }
    h2 { margin-top: 40px; }
    label { display: block; margin-top: 15px; font-weight: 600; }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      font-size: 15px;
    }
    textarea { min-height: 80px; }
    button {
      margin-top: 30px;
      padding: 14px 22px;
      font-size: 16px;
      background: #2563eb;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    .error { color: #b91c1c; margin-top: 15px; }
    .success { color: #047857; margin-top: 15px; }
  </style>
</head>
<body>

<h1>E-LegalBoom – Intake</h1>

<form id="intakeForm">

  <!-- =========================
       CLIENT INFORMATION
  ========================== -->
  <h2>Client Information</h2>

  <label>Full Legal Name</label>
  <input id="customer_name" required />

  <label>Email Address</label>
  <input id="customer_email" type="email" required />

  <label>Phone Number</label>
  <input id="customer_phone" />

  <!-- =========================
       ENTITY INFORMATION
  ========================== -->
  <h2>Entity Information</h2>

  <label>Legal Entity Name</label>
  <input id="entity_name" required />

  <label>Governing State</label>
  <input id="governing_state" required />

  <!-- =========================
       DOCUMENT INFORMATION
  ========================== -->
  <h2>Document</h2>

  <label>Document Type</label>
  <select id="doc_type" required>
    <option value="">Select</option>
    <option value="LLC">LLC</option>
    <option value="Operating Agreement">Operating Agreement</option>
    <option value="NDA">NDA</option>
    <option value="Contract">Contract</option>
  </select>

  <label>Urgency</label>
  <select id="urgency">
    <option value="normal">Normal</option>
    <option value="urgent">Urgent</option>
  </select>

  <label>Details / Special Instructions</label>
  <textarea id="details"></textarea>

  <label>File Option</label>
  <select id="file_option">
    <option value="pdf">PDF</option>
    <option value="docx">DOCX</option>
  </select>

  <!-- =========================
       PARTY INFORMATION
  ========================== -->
  <h2>Primary Counterparty</h2>

  <label>Party 1 Name</label>
  <input id="party1_name" />

  <label>Party 1 Role</label>
  <input id="party1_role" />

  <label>Party 1 Email</label>
  <input id="party1_email" type="email" />

  <!-- =========================
       SUBMIT
  ========================== -->
  <button type="submit">Submit Intake</button>
  <div id="status"></div>

</form>

<script>
  // ===============================
  // SUPABASE CLIENT
  // ===============================
  const supabase = window.supabase.createClient(
    "https://vvjbjfltqsivvxxifnvi.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2amJqZmx0cXNpdnZ4eGlmbnZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc5NzYzNTAsImV4cCI6MjA3MzU1MjM1MH0.F4zzcpCHl9v-Rnj0wgKJ5zBf1HteVyXelMLQDDEN28Q"
  );

  // ===============================
  // SUBMIT HANDLER
  // ===============================
  document.getElementById("intakeForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const status = document.getElementById("status");
    status.textContent = "Submitting…";

    const payload = {
      phone: document.getElementById("customer_phone").value,
      urgency: document.getElementById("urgency").value,
      details: document.getElementById("details").value,
      file_option: document.getElementById("file_option").value,
      parties: [
        {
          name: document.getElementById("party1_name").value,
          role: document.getElementById("party1_role").value,
          email: document.getElementById("party1_email").value
        }
      ]
    };

    const { error } = await supabase.rpc(
      "create_request_from_intake",
      {
        p_customer_email: document.getElementById("customer_email").value,
        p_customer_name: document.getElementById("customer_name").value,
        p_doc_type: document.getElementById("doc_type").value,
        p_entity_name: document.getElementById("entity_name").value,
        p_governing_state: document.getElementById("governing_state").value,
        p_payload: payload
      }
    );

    if (error) {
      console.error(error);
      status.innerHTML = `<div class="error">Order creation failed: ${error.message}</div>`;
    } else {
      status.innerHTML = `<div class="success">Order created successfully.</div>`;
      document.getElementById("intakeForm").reset();
    }
  });
</script>

</body>
</html>
