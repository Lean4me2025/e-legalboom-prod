<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>E-LegalBoom – Intake</title>

  <style>
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:#f5f7fb; color:#111; }
    header { background:#111827; color:#fff; padding:16px 18px; }
    header .brand { font-weight:800; letter-spacing:.02em; }
    .wrap { max-width: 980px; margin: 18px auto; padding: 0 16px 36px; }
    .pills { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
    .pill { background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.18); padding:8px 12px; border-radius:999px; font-weight:700; }
    .pill span { font-weight:800; color:#ffd08a; }
    .card { background:#fff; border:1px solid #e6e8ee; border-radius:14px; padding:16px; box-shadow: 0 6px 20px rgba(17,24,39,.06); }
    .grid { display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
    @media (max-width: 760px){ .grid { grid-template-columns: 1fr; } }
    label { display:block; font-size:13px; font-weight:700; margin: 10px 0 6px; color:#334155; }
    input, select, textarea {
      width:100%; padding:12px 12px; border-radius:10px; border:1px solid #d7dce6; background:#fff;
      font-size:15px; outline:none;
    }
    input:focus, select:focus, textarea:focus { border-color:#60a5fa; box-shadow: 0 0 0 4px rgba(96,165,250,.18); }
    .status { margin: 10px 0 0; font-weight:800; }
    .status.ok { color:#166534; }
    .status.bad { color:#b42318; }
    .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
    .btn {
      border:0; cursor:pointer; font-weight:900; padding:12px 14px; border-radius:12px;
      background:#ff7b2c; color:#111827;
    }
    .btn.secondary { background:#111827; color:#fff; }
    .small { font-size:12px; color:#64748b; margin-top:6px; }
    .divider { height:1px; background:#e6e8ee; margin: 14px 0; }
    .danger { background:#fff1f2; border:1px solid #fecdd3; padding:10px 12px; border-radius:12px; color:#9f1239; font-weight:800; }
  </style>

  <!-- Supabase JS (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <header>
    <div class="brand">E-LegalBoom</div>
    <div class="pills">
      <div class="pill">Tier: <span id="tierLabel">UNKNOWN</span></div>
      <div class="pill">Document(s): <span id="docLabel">—</span></div>
      <div class="pill">Request UUID: <span id="uuidLabel">—</span></div>
    </div>
    <div id="tierStatus" class="status bad">Status: Detecting tier…</div>
  </header>

  <div class="wrap">
    <div class="card">
      <h2 style="margin:0 0 6px;">Intake Information</h2>
      <div class="small">Fill this out once. We’ll use it to generate your document as soon as payment is confirmed.</div>

      <div class="divider"></div>

      <form id="intakeForm">
        <div class="grid">
          <div>
            <label for="firstName">First Name</label>
            <input id="firstName" name="first_name" autocomplete="given-name" required />
          </div>
          <div>
            <label for="lastName">Last Name</label>
            <input id="lastName" name="last_name" autocomplete="family-name" required />
          </div>
          <div>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
          </div>
          <div>
            <label for="phone">Phone</label>
            <input id="phone" name="phone" autocomplete="tel" />
          </div>
          <div>
            <label for="jurisdiction">Preferred Jurisdiction (State)</label>
            <input id="jurisdiction" name="preferred_jurisdiction" placeholder="CA, FL, TX…" />
          </div>
          <div>
            <label for="urgency">Urgency</label>
            <select id="urgency" name="urgency">
              <option value="normal">normal</option>
              <option value="rush">rush</option>
            </select>
          </div>
        </div>

        <label for="notes">Notes (optional)</label>
        <textarea id="notes" name="notes" rows="3" placeholder="Anything important we should know?"></textarea>

        <div class="divider"></div>

        <div id="errorBox" class="danger" style="display:none;"></div>

        <div class="actions">
          <button class="btn" type="submit" id="submitBtn">Submit Intake & Continue</button>
          <button class="btn secondary" type="button" id="backBtn">Back to Catalog</button>
        </div>

        <div class="small">
          If the Tier/Document shows UNKNOWN, go back and select again. We keep everything consistent across pages.
        </div>
      </form>
    </div>
  </div>

  <script>
    // === CONFIG: set these two ===
    const SUPABASE_URL = "https://vvjbjfltqsivvxxifnvi.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2amJqZmx0cXNpdnZ4eGlmbnZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc5NzYzNTAsImV4cCI6MjA3MzU1MjM1MH0.F4zzcpCHl9v-Rnj0wgKJ5zBf1HteVyXelMLQDDEN28Q";

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function getSelection() {
      const params = new URLSearchParams(window.location.search);

      const tier =
        params.get("tier") ||
        localStorage.getItem("tier") ||
        "";

      const docType =
        params.get("type") ||
        params.get("doc_type") ||
        localStorage.getItem("doc_type") ||
        "";

      // Persist so payment.html can read it too
      if (tier) localStorage.setItem("tier", tier);
      if (docType) localStorage.setItem("doc_type", docType);

      return { tier, docType };
    }

    function setStatus(ok, msg) {
      const el = document.getElementById("tierStatus");
      el.className = "status " + (ok ? "ok" : "bad");
      el.textContent = msg;
    }

    function showError(msg) {
      const box = document.getElementById("errorBox");
      box.style.display = "block";
      box.textContent = msg;
    }

    function hideError() {
      const box = document.getElementById("errorBox");
      box.style.display = "none";
      box.textContent = "";
    }

    // Init header display
    const { tier, docType } = getSelection();
    document.getElementById("tierLabel").textContent = tier || "UNKNOWN";
    document.getElementById("docLabel").textContent = docType || "—";

    if (!tier) setStatus(false, "Status: No tier detected — please return to catalog and select.");
    else setStatus(true, `Status: Tier detected (${tier}).`);

    // Back button
    document.getElementById("backBtn").addEventListener("click", () => {
      window.location.href = "catalog.html";
    });

    // Submit handler
    document.getElementById("intakeForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      hideError();

      const { tier, docType } = getSelection();
      if (!tier || !docType) {
        showError("Missing Tier or Document selection. Please go back to the catalog, select a tier and document, then return.");
        return;
      }

      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      submitBtn.textContent = "Submitting…";

      try {
        // Collect form values
        const first_name = document.getElementById("firstName").value.trim();
        const last_name  = document.getElementById("lastName").value.trim();
        const email      = document.getElementById("email").value.trim();
        const phone      = document.getElementById("phone").value.trim();
        const preferred_jurisdiction = document.getElementById("jurisdiction").value.trim();
        const urgency    = document.getElementById("urgency").value;
        const notes      = document.getElementById("notes").value.trim();

        // 1) Insert into public.requests
        // IMPORTANT: adjust column names here if your table uses different ones.
        const { data: reqRows, error: reqErr } = await sb
          .from("requests")
          .insert([{
            first_name,
            last_name,
            email,
            phone,
            preferred_jurisdiction,
            urgency,
            doc_type: docType,
            tier: tier,
            payment_status: "pending",
            status: "intake_received",
            notes
          }])
          .select("request_uuid")
          .single();

        if (reqErr) throw reqErr;

        const request_uuid = reqRows?.request_uuid;
        document.getElementById("uuidLabel").textContent = request_uuid || "—";
        if (!request_uuid) throw new Error("No request_uuid returned from insert.");

        // Persist UUID for downstream use
        localStorage.setItem("request_uuid", request_uuid);

        // 2) Insert into public.document_requests (one row for this doc type)
        const { error: docErr } = await sb
          .from("document_requests")
          .insert([{
            request_uuid,
            doc_type: docType,
            urgency
          }]);

        if (docErr) throw docErr;

        // 3) Redirect to payment with tier + doc type + request_uuid
        const url = new URL("payment.html", window.location.origin);
        url.searchParams.set("tier", tier);
        url.searchParams.set("type", docType);
        url.searchParams.set("request_uuid", request_uuid);

        window.location.href = url.toString();

      } catch (err) {
        console.error(err);
        showError("Submit failed: " + (err?.message || "Unknown error"));
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit Intake & Continue";
      }
    });
  </script>
</body>
</html>
