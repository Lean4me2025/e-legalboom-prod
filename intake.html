<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>E-LegalBoom – Document Intake</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- SUPABASE CLIENT -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      background: #f4f6f9;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: #222;
    }
    .page {
      max-width: 850px;
      margin: 40px auto;
      background: #fff;
      padding: 40px 48px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }
    h1 {
      margin-top: 0;
      font-size: 26px;
      border-bottom: 2px solid #eee;
      padding-bottom: 12px;
    }
    h2 {
      margin-top: 32px;
      font-size: 18px;
      border-bottom: 1px solid #eee;
      padding-bottom: 6px;
    }
    .row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-top: 16px;
    }
    .row.single { grid-template-columns: 1fr; }
    label {
      display: block;
      font-size: 13px;
      margin-bottom: 4px;
      font-weight: 600;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    textarea { min-height: 90px; }
    .party {
      border: 1px dashed #ccc;
      padding: 16px;
      margin-top: 16px;
    }
    button {
      margin-top: 30px;
      padding: 14px 24px;
      font-size: 16px;
      background: #1e3cff;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<form class="page" id="intakeForm">
  <h1>Legal Document Intake</h1>

  <!-- CONTEXT -->
  <input type="hidden" name="doc_type" id="doc_type">
  <input type="hidden" name="tier" id="tier">

  <h2>Client Information</h2>
  <div class="row">
    <div><label>First Name</label><input name="first_name" required></div>
    <div><label>Last Name</label><input name="last_name" required></div>
    <div><label>Email</label><input name="email" type="email" required></div>
    <div><label>Phone</label><input name="phone"></div>
  </div>

  <h2>Primary Address</h2>
  <div class="row single">
    <div><label>Street</label><input name="street" required></div>
  </div>
  <div class="row">
    <div><label>City</label><input name="city" required></div>
    <div><label>State of Residence</label><input name="state_residence" required></div>
    <div><label>ZIP</label><input name="zip" required></div>
  </div>

  <h2>Governing Jurisdiction</h2>
  <div class="row single">
    <div><label>Governing State</label><input name="governing_state" required></div>
  </div>

  <h2>Parties</h2>
  <div class="party">
    <strong>Party 1</strong>
    <div class="row">
      <div><label>Name</label><input name="party1_name"></div>
      <div><label>Role</label><input name="party1_role"></div>
    </div>
  </div>

  <div class="party">
    <strong>Party 2</strong>
    <div class="row">
      <div><label>Name</label><input name="party2_name"></div>
      <div><label>Role</label><input name="party2_role"></div>
    </div>
  </div>

  <h2>Special Terms / Risks</h2>
  <div class="row single">
    <div><textarea name="special_terms"></textarea></div>
  </div>

  <button type="submit">Submit Intake</button>
</form>

<script>
/* ================================
   SUPABASE CONFIG — REQUIRED
   ================================ */

const SUPABASE_URL = "https://vvjbjfltqsivvxxifnvi.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2amJqZmx0cXNpdnZ4eGlmbnZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc5NzYzNTAsImV4cCI6MjA3MzU1MjM1MH0.F4zzcpCHl9v-Rnj0wgKJ5zBf1HteVyXelMLQDDEN28Q";

/* ================================
   INIT
   ================================ */

const supabase = supabaseJs.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

/* ================================
   CONTEXT FROM URL
   ================================ */

const params = new URLSearchParams(window.location.search);
document.getElementById("doc_type").value = params.get("doc_type") || "";
document.getElementById("tier").value = params.get("tier") || "";

/* ================================
   SUBMIT HANDLER
   ================================ */

document.getElementById("intakeForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const formData = Object.fromEntries(new FormData(e.target).entries());

  const { error } = await supabase
    .from("document_requests")   // ← your intake table
    .insert([formData]);

  if (error) {
    alert("Submission failed. Please try again.");
    console.error(error);
  } else {
    alert("Intake submitted successfully.");
    e.target.reset();
  }
});
</script>

</body>
</html>
