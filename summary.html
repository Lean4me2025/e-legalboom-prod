<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>E-LegalBoom – Order Summary</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      margin: 0;
      padding: 40px;
      color: #111827;
    }

    .box {
      max-width: 640px;
      margin: auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 6px 18px rgba(0,0,0,0.05);
    }

    h1 {
      margin-top: 0;
      font-size: 1.5rem;
    }

    .summary-line {
      margin: 10px 0;
      font-size: 0.95rem;
    }

    .actions {
      margin-top: 24px;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 0.95rem;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }

    .primary {
      background: #2563eb;
      color: #ffffff;
    }

    .danger {
      margin-top: 10px;
      background: #ef4444;
      color: #ffffff;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Review Your Request</h1>

    <div id="summary"></div>

    <div class="actions">
      <button class="primary" onclick="continueToIntake()">
        Continue to Intake
      </button>

      <button class="danger" onclick="abortOrder()">
        Abort & Start Over
      </button>
    </div>
  </div>

  <script src="summary.js"></script>
</body>
</html>
