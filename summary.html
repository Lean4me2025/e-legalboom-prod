<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>E-LegalBoom – Summary</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #ffffff;
      color: #1f2937;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 48px 24px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 24px;
    }

    .row {
      margin-bottom: 14px;
      font-size: 16px;
    }

    .label {
      font-weight: 600;
    }

    .cta {
      margin-top: 32px;
      display: inline-block;
      background: #1d4ed8;
      color: #ffffff;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 16px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Review Your Selection</h1>

    <div class="row">
      <span class="label">Document:</span>
      <span id="document_type"></span>
    </div>

    <div class="row">
      <span class="label">Tier:</span>
      <span id="tier"></span>
    </div>

    <div class="row">
      <span class="label">Price:</span>
      <span id="price"></span>
    </div>

    <a id="continueBtn" class="cta" href="#">Continue to Intake</a>
  </div>

  <script>
    // --- Read canonical values ---
    const params = new URLSearchParams(window.location.search);

    const document_type = params.get("document_type");
    const tier = params.get("tier");
    const price = params.get("price");

    // --- HARD GUARD ---
    if (!document_type || !tier || !price) {
      window.location.href = "/catalog.html";
    }

    // --- Render read-only summary ---
    document.getElementById("document_type").textContent = document_type;
    document.getElementById("tier").textContent = tier;
    document.getElementById("price").textContent = `$${price}`;

    // --- Pass forward unchanged ---
    const intakeUrl =
      `/intake.html?document_type=${encodeURIComponent(document_type)}` +
      `&tier=${encodeURIComponent(tier)}` +
      `&price=${encodeURIComponent(price)}`;

    document.getElementById("continueBtn").href = intakeUrl;
  </script>
</body>
</html>
