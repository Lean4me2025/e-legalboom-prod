<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>E-LegalBoom – Confirm Your Selection</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f8fc;
      color: #1e1e2f;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 760px;
      margin: 60px auto;
      background: #ffffff;
      padding: 32px 36px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }

    h1 {
      margin-top: 0;
      font-size: 26px;
    }

    .summary-box {
      background: #f0f4ff;
      padding: 16px 20px;
      border-radius: 8px;
      margin-bottom: 28px;
    }

    .summary-box p {
      margin: 6px 0;
      font-weight: 500;
    }

    .section {
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    select, input[type="radio"] {
      margin-top: 6px;
    }

    .radio-group label {
      font-weight: normal;
      margin-right: 20px;
    }

    button {
      background: #2b6cff;
      color: #ffffff;
      border: none;
      padding: 14px 22px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Let’s make sure we have this right</h1>

    <!-- ORIENTATION / CONFIRMATION -->
    <div class="summary-box">
      <p><strong>Tier selected:</strong> <span id="tierLabel"></span></p>
      <p><strong>Document selected:</strong> <span id="docLabel"></span></p>
    </div>

    <p>
      Before we prepare your document, we just need a few clarifying details.
      This ensures your document is created correctly the first time.
    </p>

    <!-- CLARIFYING QUESTIONS -->
    <div class="section">
      <label for="stateSelect">Which state will this entity be formed in?</label>
      <select id="stateSelect">
        <option value="">— Select a state —</option>
        <option value="CA">California</option>
        <option value="TX">Texas</option>
        <option value="FL">Florida</option>
        <option value="NY">New York</option>
        <!-- Add remaining states as needed -->
      </select>
    </div>

    <div class="section">
      <label>How will this LLC be managed?</label>
      <div class="radio-group">
        <label>
          <input type="radio" name="management" value="member" />
          Member-managed
        </label>
        <label>
          <input type="radio" name="management" value="manager" />
          Manager-managed
        </label>
      </div>
    </div>

    <button id="continueBtn" disabled>Continue to Intake</button>
  </div>

  <script>
    // Read URL params
    const params = new URLSearchParams(window.location.search);
    const tier = params.get("tier");
    const docType = params.get("doc_type");

    // Simple label mapping (expand later)
    const tierMap = {
      T1: "Tier 1",
      T2: "Tier 2",
      T3: "Tier 3",
      BUNDLE: "Bundle"
    };

    const docMap = {
      llc_multi_member: "Multi-Member LLC",
      llc_single_member: "Single-Member LLC"
    };

    document.getElementById("tierLabel").textContent =
      tierMap[tier] || tier || "—";

    document.getElementById("docLabel").textContent =
      docMap[docType] || docType || "—";

    // Enable button only when required fields selected
    const stateSelect = document.getElementById("stateSelect");
    const continueBtn = document.getElementById("continueBtn");

    function checkReady() {
      const state = stateSelect.value;
      const management = document.querySelector('input[name="management"]:checked');
      continueBtn.disabled = !(state && management);
    }

    stateSelect.addEventListener("change", checkReady);
    document.querySelectorAll('input[name="management"]').forEach(r =>
      r.addEventListener("change", checkReady)
    );

    // Continue → Intake
    continueBtn.addEventListener("click", () => {
      const state = stateSelect.value;
      const management = document.querySelector('input[name="management"]:checked').value;

      const intakeUrl =
        `/intake.html?tier=${encodeURIComponent(tier)}` +
        `&doc_type=${encodeURIComponent(docType)}` +
        `&state=${encodeURIComponent(state)}` +
        `&management=${encodeURIComponent(management)}`;

      window.location.href = intakeUrl;
    });
  </script>
</body>
</html>
